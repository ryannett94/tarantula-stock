name: Check spider stock

on:
  schedule:
    # 07:40 and 18:40 UK winter time (GitHub uses UTC; runs an hour later in summer).
    # GitHub sometimes skips scheduled runs, so each check has a backup 25 minutes later.
    - cron: "40 7 * * *"
    - cron: "5 8 * * *"
    - cron: "40 18 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch: {}
  # Also run straight away whenever the shop list or tracker changes.
  push:
    branches: [main]
    paths:
      - vendors.yml
      - tracker/**
      - .github/workflows/check-stock.yml

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check vendors
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'ryan-tstock-458e621b' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python tracker/scrape.py

      - name: Save results
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/stock.json docs/debug.json
          git diff --cached --quiet || git commit -m "Stock update $(date -u +%F' '%H:%M)"
          git pull --rebase origin main && git push
