name: Check spider stock

on:
  schedule:
    # 07:40 and 18:40 UK winter time (GitHub uses UTC; runs an hour later in summer).
    # GitHub sometimes skips scheduled runs, so each check has a backup 25 minutes later.
    - cron: "40 7 * * *"
    - cron: "5 8 * * *"
    - cron: "40 18 * * *"
    - cron: "5 19 * * *"
  workflow_dispatch: {}
  # Also run straight away whenever the shop list or tracker changes.
  push:
    branches: [main]
    paths:
      - vendors.yml
      - corrections.yml
      - tracker/**
      - .github/workflows/check-stock.yml

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Keep the downloaded browser between runs so a check starts faster.
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Check vendors
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'ryan-tstock-458e621b' }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SCRAPE_THREADS: "8"
        run: python tracker/scrape.py

      # Photos and info for any species seen for the first time (a few per run).
      - name: Species info
        continue-on-error: true
        timeout-minutes: 8
        env:
          MAX_LOOKUPS: "25"
        run: python tracker/enrich.py

      - name: Save results
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/stock.json docs/debug.json docs/species.json
          git diff --cached --quiet || git commit -m "Stock update $(date -u +%F' '%H:%M)"
          git pull --rebase origin main && git push
