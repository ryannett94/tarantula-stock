<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UK Spider Stock</title>
<meta name="theme-color" content="#14110f">
<style>
  :root {
    --bg: #14110f; --panel: #1e1a17; --panel2: #262019; --line: #2e2824; --text: #f1ebe4; --muted: #a39a90;
    --accent: #e8833a; --back: #5fb38a; --r: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 40px; }
  header { padding: 20px 16px 6px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .bar { background: var(--bg); padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab { flex: 1; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 9px 6px; font-size: 14px; font-weight: 600; }
  .tab[aria-pressed="true"] { background: var(--accent); color: #1a120b; border-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  input, select { flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font-size: 16px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  main { padding: 8px 16px; }
  .count { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .sp { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    margin-bottom: 10px; overflow: hidden; }
  .sp-head { padding: 12px 14px 10px; display: flex; gap: 12px; align-items: center; }
  .sp-head .txt { flex: 1; min-width: 0; }
  .thumb { width: 72px; height: 72px; flex: 0 0 72px; border-radius: 10px; object-fit: cover;
    background: var(--panel2); border: 1px solid var(--line); }
  .thumb.none { display: grid; place-items: center; color: var(--muted); font-size: 26px; }
  .sp-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .sp-name { font-weight: 700; font-size: 17px; }
  .sp-name i { font-style: italic; }
  .from { white-space: nowrap; color: var(--muted); font-size: 13px; }
  .from b { color: var(--text); font-size: 16px; }
  .common { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .offer { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
    padding: 10px 14px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
  .offer:active { background: var(--panel2); }
  .shop { font-weight: 600; font-size: 14px; }
  .desc { color: var(--muted); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 1px; }
  .price { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .buy { background: var(--accent); color: #1a120b; font-weight: 700; font-size: 13px;
    padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .offer.out { opacity: .5; }
  .offer.out .buy { background: var(--line); color: var(--muted); }
  .badge { font-size: 10px; font-weight: 800; letter-spacing: .05em; padding: 2px 6px; border-radius: 5px; }
  .b-new { background: var(--accent); color: #1a120b; }
  .b-back { background: var(--back); color: #0d1f16; }
  .more { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none;
    color: var(--accent); font-weight: 600; font-size: 14px; padding: 10px; }
  details { margin: 24px 16px 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
  summary { font-weight: 600; cursor: pointer; }
  .v { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .v:first-of-type { border-top: 0; }
  .ok { color: var(--back); } .fail { color: #e06c5a; }
  .err { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
</style>
</head>
<body>
<header>
  <h1>UK Spider Stock</h1>
  <div class="sub" id="checked">Loading…</div>
</header>

<div class="bar">
  <div class="tabs" id="tabs">
    <button class="tab" data-view="new" aria-pressed="true">New</button>
    <button class="tab" data-view="in" aria-pressed="false">In stock</button>
    <button class="tab" data-view="all" aria-pressed="false">All</button>
  </div>
  <div class="row"><input id="q" type="search" placeholder="Search species or common name" autocomplete="off"></div>
  <div class="row">
    <select id="vendor"><option value="">All shops</option></select>
    <select id="sex">
      <option value="">Any sex</option><option value="female">Females</option>
      <option value="male">Males</option><option value="pair">Pairs</option><option value="unsexed">Unsexed</option>
    </select>
  </div>
  <div class="chips" id="groups" style="margin-bottom:8px">
    <button class="chip" data-group="" aria-pressed="true">All spiders</button>
    <button class="chip" data-group="tarantula" aria-pressed="false">Tarantulas</button>
    <button class="chip" data-group="jumping" aria-pressed="false">Jumping spiders</button>
    <button class="chip" data-group="other" aria-pressed="false">True &amp; other spiders</button>
  </div>
  <div class="chips" id="stages">
    <button class="chip" data-stage="" aria-pressed="true">All sizes</button>
    <button class="chip" data-stage="sling" aria-pressed="false">Slings</button>
    <button class="chip" data-stage="juvenile" aria-pressed="false">Juveniles</button>
    <button class="chip" data-stage="subadult" aria-pressed="false">Sub-adults</button>
    <button class="chip" data-stage="adult" aria-pressed="false">Adults</button>
  </div>
</div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<details id="status"><summary>Shops checked</summary><div id="vendors"></div></details>

<script>
const NEW_DAYS = 7, SHOW = 4;
const STAGE = { sling: "Sling", juvenile: "Juvenile", subadult: "Sub-adult", adult: "Adult" };
const SEX = { female: "Female", male: "Male", pair: "Pair" };
let data = null, view = "new", stage = "", group = "";
const expanded = new Set();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + " h ago";
  return Math.round(h / 24) + " days ago";
}
function freshAt(it) {
  const t = [it.new_at, it.restocked_at].filter(Boolean).sort().pop();
  return t && it.in_stock && (Date.now() - new Date(t)) < NEW_DAYS * 864e5 ? t : null;
}
function money(it) {
  return it.price ? (it.currency === "USD" ? "$" : "£") + Number(it.price).toFixed(2).replace(/\.00$/, "") : "";
}
function sizeOf(it) {
  const m = (it.name + " " + (it.hint || "")).match(/\d+(?:\.\d+)?\s*(?:-|–|to)?\s*(?:\d+(?:\.\d+)?)?\s*cm/i);
  return m ? m[0].replace(/\s+/g, "").replace(/CM/, "cm") : "";
}
function speciesTitle(name) {
  // Italicise "Genus species", leave a quoted locality upright.
  const m = name.match(/^([A-Z][a-z]+)\s+(sp\.)?\s*(.*)$/);
  if (!m) return esc(name);
  return m[2] ? `<i>${esc(m[1])}</i> sp. ${esc(m[3])}` : `<i>${esc(m[1])} ${esc(m[3])}</i>`;
}

function offerPasses(it) {
  if (it.gone) return false;
  if (view === "in" && !it.in_stock) return false;
  if (view === "new" && !freshAt(it)) return false;
  if ($("#vendor").value && it.vendor !== $("#vendor").value) return false;
  if (stage && it.stage !== stage) return false;
  if (group && (it.group || "tarantula") !== group) return false;
  const sx = $("#sex").value;
  if (sx && (sx === "unsexed" ? it.sex : it.sex !== sx)) return false;
  return true;
}

function render() {
  if (!data) return;
  const q = $("#q").value.trim().toLowerCase();
  const groups = new Map();
  for (const it of Object.values(data.items)) {
    if (!offerPasses(it)) continue;
    const key = it.species || ("x:" + it.vendor + ":" + it.name);
    if (!groups.has(key)) groups.set(key, { key, name: it.species_name || it.name, common: it.common || "", offers: [] });
    const g = groups.get(key);
    if (!g.common && it.common) g.common = it.common;
    g.offers.push(it);
  }
  let list = [...groups.values()];
  if (q) list = list.filter(g => (g.name + " " + g.common + " " + g.offers.map(o => o.name + " " + o.vendor).join(" ")).toLowerCase().includes(q));
  for (const g of list) {
    g.offers.sort((a, b) => (b.in_stock - a.in_stock) || ((a.price || 1e9) - (b.price || 1e9)));
    g.fresh = g.offers.map(freshAt).filter(Boolean).sort().pop() || "";
    g.shops = new Set(g.offers.filter(o => o.in_stock).map(o => o.vendor)).size;
    const prices = g.offers.filter(o => o.in_stock && o.price && o.currency !== "USD").map(o => o.price);
    g.min = prices.length ? Math.min(...prices) : null;
  }
  list.sort((a, b) => view === "new" ? (b.fresh.localeCompare(a.fresh) || a.name.localeCompare(b.name))
                                     : a.name.localeCompare(b.name));

  const offers = list.reduce((n, g) => n + g.offers.length, 0);
  $("#count").textContent = `${list.length} species · ${offers} listing${offers === 1 ? "" : "s"}` +
    (view === "new" ? ` new or back in the last ${NEW_DAYS} days` : "");

  $("#list").innerHTML = list.length ? list.map(g => {
    const open = expanded.has(g.key);
    const shown = open ? g.offers : g.offers.slice(0, SHOW);
    const rows = shown.map(it => {
      const f = freshAt(it);
      const badge = f ? (f === it.restocked_at ? '<span class="badge b-back">BACK</span>' : '<span class="badge b-new">NEW</span>') : "";
      const bits = [STAGE[it.stage], SEX[it.sex], sizeOf(it)].filter(Boolean).join(" · ");
      return `<a class="offer ${it.in_stock ? "" : "out"}" href="${esc(it.url)}" target="_blank" rel="noopener">
        <div><div class="shop">${esc(it.vendor)}</div>
          <div class="desc">${badge}<span>${esc(bits || it.name)}</span></div></div>
        <span class="price">${money(it)}</span>
        <span class="buy">${it.in_stock ? "Buy ›" : "Sold out"}</span></a>`;
    }).join("");
    const more = g.offers.length > SHOW
      ? `<button class="more" data-key="${esc(g.key)}">${open ? "Show fewer" : `Show all ${g.offers.length}`}</button>` : "";
    const pic = (g.offers.find(o => o.in_stock && o.image) || g.offers.find(o => o.image) || {}).image;
    const thumb = pic ? `<img class="thumb" src="${esc(pic)}" alt="" loading="lazy" referrerpolicy="no-referrer"
        onerror="this.outerHTML='<div class=&quot;thumb none&quot;>🕷</div>'">` : `<div class="thumb none">🕷</div>`;
    return `<section class="sp"><div class="sp-head">${thumb}<div class="txt"><div class="sp-top">
        <span class="sp-name">${g.key.startsWith("x:") ? esc(g.name) : speciesTitle(g.name)}</span>
        ${g.min ? `<span class="from">from <b>£${Number(g.min).toFixed(2).replace(/\.00$/, "")}</b></span>` : ""}</div>
        <div class="common">${esc(g.common)}${g.common && g.shops ? " · " : ""}${g.shops ? g.shops + (g.shops === 1 ? " shop" : " shops") : ""}</div>
      </div></div>${rows}${more}</section>`;
  }).join("") : `<div class="empty">${view === "new" ? "Nothing new this week for these filters." : "No matches."}</div>`;
}

function renderVendors() {
  const vs = Object.entries(data.vendors).sort((a, b) => a[0].localeCompare(b[0]));
  const ok = vs.filter(([, v]) => v.status === "ok").length;
  $("#status summary").textContent = `Shops checked (${ok} of ${vs.length} working)`;
  $("#vendors").innerHTML = vs.map(([name, v]) => `<div class="v"><div>${esc(name)}
      ${v.status !== "ok" ? `<div class="err">${esc(v.error)}</div>` : ""}</div>
      <div class="${v.status === "ok" ? "ok" : "fail"}">${v.status === "ok" ? `${v.in_stock}/${v.count} in stock` : "failed"}</div></div>`).join("");
  const sel = $("#vendor");
  vs.forEach(([name]) => { const o = document.createElement("option"); o.value = o.textContent = name; sel.appendChild(o); });
}

$("#tabs").onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  view = b.dataset.view;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};
$("#stages").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  stage = b.dataset.stage;
  document.querySelectorAll("#stages .chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};
$("#groups").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  group = b.dataset.group;
  document.querySelectorAll("#groups .chip").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};
$("#list").onclick = e => {
  const b = e.target.closest(".more"); if (!b) return;
  expanded.has(b.dataset.key) ? expanded.delete(b.dataset.key) : expanded.add(b.dataset.key);
  render();
};
$("#q").oninput = render;
$("#vendor").onchange = render;
$("#sex").onchange = render;

fetch("stock.json?t=" + Date.now()).then(r => r.json()).then(j => {
  data = j;
  $("#checked").textContent = j.checked ? "Last checked " + ago(j.checked) : "Not checked yet.";
  renderVendors(); render();
}).catch(() => { $("#checked").textContent = "Couldn't load stock list."; });
</script>
</body>
</html>
