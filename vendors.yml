# Spider vendors to check (tarantulas, jumping spiders, true spiders).
# For each shop the tracker tries, in order:
#   1. Shopify product feed   (the collection in "listings" if there is one, else the whole shop)
#   2. WooCommerce store feed (base/wp-json/wc/store/v1/products)
#   3. Reading the listing pages below in a real browser
# Listing pages are used only if 1 and 2 fail. If a shop shows "failed" on the
# stock page, open the shop on your phone, copy the URL of its tarantula page and
# paste it under that shop's "listings".
# follow: regex   = also open links matching this from the listing pages (sibling categories)
# filter: true    = the listing page mixes tarantulas with other things, so keep
#                   only tarantulas (matched by name or genus)
# stage: ...      = every listing from this shop is this size (e.g. spiderlings)
# enabled: false  = pause a shop without deleting it

vendors:
  - name: The Spider Shop
    base: https://thespidershop.co.uk
    listings:
      - https://thespidershop.co.uk/product-category/tarantulas/

  - name: Eight Legged Emporium
    base: https://eightleggedemporium.co.uk
    listings:
      - https://eightleggedemporium.co.uk/emporium
      - https://eightleggedemporium.co.uk/
  - name: Spider Farm
    base: https://spiderfarm.co.uk
    listings:
      - https://spiderfarm.co.uk/shop

  - name: So Many Legs
    base: https://www.somanylegs.co.uk
    listings:
      - https://www.somanylegs.co.uk/tarantulas
      - https://www.somanylegs.co.uk/shop

  - name: Portsmouth Tarantulas
    base: https://www.portsmouthtarantulas.co.uk
    filter: true
    follow: '/shop-1/[^/]+-c\d+$'
    listings:
      - https://www.portsmouthtarantulas.co.uk/shop-1/Slings-c27598628
      - https://www.portsmouthtarantulas.co.uk/shop-1
  - name: Spa Spiders
    base: https://spaspiders.co.uk
    listings:
      - https://spaspiders.co.uk/mygalomorphae-true-spiders/
      - https://spaspiders.co.uk/shop/
      - https://spaspiders.co.uk/

  - name: Up in the Trees
    base: https://upinthetrees.co.uk
    filter: true
    listings:
      - https://upinthetrees.co.uk/shop/
      - https://upinthetrees.co.uk/product-tag/tarantulas/

  - name: Just One More
    base: https://www.justonemore.uk
    filter: true
    listings:
      - https://www.justonemore.uk/shop/Jumping-spiders-c167146093/
      - https://www.justonemore.uk/shop/True-spiders-c203842271/
      - https://www.justonemore.uk/shop
      - https://www.justonemore.uk/

  - name: Bugnut
    base: https://www.bugnut.co.uk
    filter: true
    listings:
      - https://www.bugnut.co.uk/shop
      - https://www.bugnut.co.uk/

  - name: Ely Exotics
    base: https://shop.elyexotics.co.uk
    filter: true
    listings:
      - https://shop.elyexotics.co.uk/product-category/livestock/
  - name: Spoodoire
    base: https://spoodoire.uk
    listings:
      - https://spoodoire.uk/shop/
      - https://spoodoire.uk/

  - name: Swansea Spiders
    base: https://swanseaspiders.co.uk
    listings:
      - https://www.swanseaspiders.co.uk/shop/True-Spiders-c198521145/
      - https://swanseaspiders.co.uk/shop
      - https://swanseaspiders.co.uk/

  - name: MARPC
    base: https://www.marpc.co.uk
    filter: true
    # MARPC only publishes price lists ("please contact us to check on price and
    # availability"), with no sold-out markers. Nothing there proves stock, so their
    # listings show as "phone to check" with the list's date, never "in stock".
    stock: unconfirmed
    listings:
      - url: https://www.marpc.co.uk/html/spiderlings.html
        stage: spiderlings
      - url: https://www.marpc.co.uk/html/juvenile-spiders.html
        stage: juvenile
      - url: https://www.marpc.co.uk/html/sub-adult-and-adult-spiders.html
  - name: Riverview Reptiles
    base: https://www.riverviewreptiles.co.uk
    listings:
      - https://www.riverviewreptiles.co.uk/collections/jumping-spiders-and-other-spiders
      - https://www.riverviewreptiles.co.uk/collections/tarantulas

  - name: Tarantula Room
    base: https://tarantularoom.co.uk
    listings:
      - https://tarantularoom.co.uk/product-category/tarantulas/

  - name: BugzUK
    base: https://bugzuk.com
    filter: true
    listings:
      - https://www.bugzuk.com/store/true-spiders
      - https://bugzuk.com/store/tarantulas
  - name: Bugpets
    base: https://bugpets.co.uk
    listings:
      - https://bugpets.co.uk/spiderling-tarantulas
      - https://bugpets.co.uk/juvenile-tarantulas
      - https://bugpets.co.uk/adult-tarantulas
  - name: The Praying Mantis Shop
    base: https://theprayingmantis.co.uk
    listings:
      - https://theprayingmantis.co.uk/product-category/tarantulas/

  - name: Exotics@Heart
    base: https://www.exoticsatheart.com
    filter: true
    listings:
      - https://www.exoticsatheart.com/shop/tarantulas/2?page=1&limit=180&sort_by=category_order&sort_order=asc
      - https://www.exoticsatheart.com/shop/other-spiders/10?page=1&limit=180&sort_by=category_order&sort_order=asc
